[build-system]
# setuptools>=77: SPDX `license` strings + `license-files` (the TOML-table form
# is deprecated and stops building after 2027-02-18).
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auralite-ai"
version = "2.6.5"
description = "Educational yet deployable LLM framework with native training, quantization, RAG, and serving"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "AuraLite AI contributors"}]
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "matplotlib>=3.5",
]

[project.scripts]
auralite = "auralite_cli:main"

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=4", "hypothesis>=6", "pytest-benchmark>=4",
        "fastapi>=0.111", "uvicorn>=0.30", "httpx>=0.27", "pydantic>=2",
        # Starlette >= 1.6 deprecates plain httpx for TestClient
        # (StarletteDeprecationWarning in every CI job) and uses httpx2 when it is
        # installed; httpx stays for older Starlette and the importorskip guards.
        "httpx2>=2",
        # The release/packaging tests parse the workflows and pyproject.toml.
        # Both used to arrive only by accident (a dev machine with PyYAML;
        # Python >= 3.11 for tomllib), which broke CI on clean runners.
        "pyyaml>=6", "tomli>=1.1; python_version < '3.11'",
        # tests/test_packaging.py builds a real wheel offline (no isolation).
        "setuptools>=77"]
lint = ["ruff>=0.5", "pyright>=1.1"]
full = ["llama-cpp-python>=0.2.90", "transformers>=4.40", "peft>=0.11",
        "bitsandbytes>=0.43; platform_system != 'Darwin'", "safetensors>=0.4", "accelerate>=0.30", "sentencepiece>=0.2", "protobuf>=4.21", "tiktoken>=0.7", "pydantic>=2"]
# NOTE (v2.6.5): `auto-gptq`, `optimum` and `chromadb` were listed here but are
# not imported anywhere in the codebase — GPTQ/AWQ are implemented natively in
# quantization.py and the RAG stack uses the built-in hashed embeddings. The
# unused extras were removed to keep installs honest and small.
serve = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]
vllm = ["vllm>=0.5; platform_system == 'Linux'"]
rag = ["sentence-transformers>=3", "faiss-cpu>=1.8"]
safetensors = ["safetensors>=0.4"]
export = ["onnx>=1.15", "onnxruntime>=1.17"]
hf = ["transformers>=4.40", "peft>=0.11", "accelerate>=0.30"]
dev = ["auralite-ai[test,lint,full,serve,rag]"]

[tool.setuptools]
# Flat layout: every top-level runtime module must be listed here explicitly.
# `auralite_cli` (the `auralite` console script) and `image_engine` (the Image tab)
# were missing until v2.6.5, so a wheel/sdist install had a dead `auralite`
# command — invisible in CI because CI uses editable installs. Guarded by
# tests/test_packaging.py (both directions + a real wheel build).
py-modules = ["quantization", "quantization_backends", "web_tools", "hf_integration", "chat_interface", "evaluation", "eval", "export", "gui_app",
              "auralite_cli", "image_engine"]
packages = ["model_engine", "gui", "gui.tabs", "kernels", "server", "agent"]

[tool.setuptools.package-data]
# PEP 561 marker: model_engine ships inline type hints (v2.6.5).
model_engine = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", "build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=line"
markers = [
    "integration: requires optional dependencies (onnx, transformers, lm_eval, llama-cpp-python)",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "setup.py"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

reportMissingImports = false
reportUnusedImport = false
reportMissingTypeArgument = false
reportUnknownParameterType = false
reportMissingParameterType = false
reportUnknownLambdaType = false
reportUntypedBaseClass = false
reportAttributeAccessIssue = false
