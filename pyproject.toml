[build-system]
# setuptools>=77: SPDX `license` strings + `license-files` (the TOML-table form
# is deprecated and stops building after 2027-02-18).
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auralite-ai"
version = "2.17.0"
description = "Educational yet deployable LLM framework with native training, quantization, RAG, and serving"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "AuraLite AI contributors"}]
keywords = ["llm", "transformer", "pytorch", "education", "training", "quantization",
            "torch-export", "onnx", "openai-api", "gguf"]
# Keep the Python list in sync with the CI test matrix (tests/test_release.py
# checks it). No "License ::" classifier: with an SPDX `license` string (PEP 639)
# setuptools rejects license classifiers.
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Education",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "matplotlib>=3.5",
]

[project.urls]
Homepage = "https://github.com/AlexanderNyr/AuraLite-AI"
Documentation = "https://github.com/AlexanderNyr/AuraLite-AI/blob/main/docs/quickstart.md"
Repository = "https://github.com/AlexanderNyr/AuraLite-AI"
Issues = "https://github.com/AlexanderNyr/AuraLite-AI/issues"
Changelog = "https://github.com/AlexanderNyr/AuraLite-AI/blob/main/CHANGELOG.md"

[project.scripts]
auralite = "auralite.cli:main"

[project.gui-scripts]
# Windows: starts without a console window. Same as `python -m auralite.gui`.
auralite-gui = "auralite.gui.app:main"

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=4", "hypothesis>=6", "pytest-benchmark>=4",
        "fastapi>=0.111", "uvicorn>=0.30", "httpx>=0.27", "pydantic>=2",
        # Starlette >= 1.6 deprecates plain httpx for TestClient
        # (StarletteDeprecationWarning in every CI job) and uses httpx2 when it is
        # installed; httpx stays for older Starlette and the importorskip guards.
        "httpx2>=2",
        # The release/packaging tests parse the workflows; PyYAML used to arrive
        # only by accident (a dev machine), which broke CI on clean runners.
        "pyyaml>=6",
        # tests/test_packaging.py builds a real wheel offline (no isolation).
        "setuptools>=77",
        # 2.17: the official OpenAI client reads JSON mode and tool calls from
        # the server (tests/test_server_structured_v217.py)
        "openai>=1.40"]
lint = ["ruff>=0.5", "pyright>=1.1"]
# v2.6.6: llama-cpp-python left `full` for its own `gguf` extra. PyPI only has its
# source distribution, so every `pip install '.[full]'` compiled llama.cpp (and
# failed on Windows without build tools). Install `gguf` with the prebuilt
# wheels instead — README → "`.gguf` models".
full = ["transformers>=4.46", "peft>=0.13",
        "bitsandbytes>=0.43; platform_system != 'Darwin'", "safetensors>=0.4", "accelerate>=1.1", "sentencepiece>=0.2", "protobuf>=4.21", "tiktoken>=0.7", "pydantic>=2"]
gguf = ["llama-cpp-python>=0.3"]
# NOTE (v2.6.5): `auto-gptq`, `optimum` and `chromadb` were listed here but are
# not imported anywhere in the codebase — GPTQ/AWQ are implemented natively in
# quantization.py and the RAG stack uses the built-in hashed embeddings. The
# unused extras were removed to keep installs honest and small.
serve = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]
# Dynamic INT8 once PyTorch drops the deprecated torch.ao.quantization (the `auto`
# backend switches over by itself); explicit with AURALITE_QUANT_BACKEND=torchao.
# torchao releases track recent PyTorch versions — see torchao's compatibility table.
torchao = ["torchao>=0.10"]
vllm = ["vllm>=0.5; platform_system == 'Linux'"]
rag = ["sentence-transformers>=3", "faiss-cpu>=1.8"]
safetensors = ["safetensors>=0.4"]
# onnxscript: torch.onnx.export(dynamo=True), the primary ONNX exporter since 2.7.0
# (without it AuraLite falls back to the deprecated TorchScript exporter).
# `.pt2` export (torch.export) needs nothing beyond torch.
export = ["onnx>=1.15", "onnxruntime>=1.17", "onnxscript>=0.5"]
# Lower bounds = the oldest stack CI tests for real (integrations job, "minimum").
hf = ["transformers>=4.46", "peft>=0.13", "accelerate>=1.1"]
# 4-/8-bit QLoRA loading — the only feature that needs bitsandbytes (2.6.6).
qlora = ["auralite-ai[hf]", "bitsandbytes>=0.43; platform_system != 'Darwin'"]
dev = ["auralite-ai[test,lint,full,serve,rag]"]

[tool.setuptools.packages.find]
# 2.7.0: one import package. The flat layout installed 16 top-level names
# (`model_engine`, `server`, `export`, `kernels`, …) into site-packages, where
# generic names collide with other distributions — Hugging Face ships `kernels`.
# The deprecated aliases in the repository root are deliberately not packaged
# (tests/test_packaging.py builds a wheel and checks its top level is `auralite`).
include = ["auralite", "auralite.*"]
namespaces = false

[tool.setuptools.package-data]
# PEP 561 marker for the whole package (was model_engine/py.typed until 2.6).
auralite = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", "build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=line"
# 2.14: a test that runs for 10 minutes dumps the stack of every thread (the
# 2.13 Windows leg hung without a trace; the CI job also has a time limit).
faulthandler_timeout = 600
markers = [
    "integration: requires optional dependencies (onnx, transformers, lm_eval, llama-cpp-python)",
]

[tool.coverage.run]
source = ["auralite"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

reportMissingImports = false
reportUnusedImport = false
reportMissingTypeArgument = false
reportUnknownParameterType = false
reportMissingParameterType = false
reportUnknownLambdaType = false
reportUntypedBaseClass = false
reportAttributeAccessIssue = false
