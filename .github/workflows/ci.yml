name: AuraLite CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[lint]'
      - name: Ruff critical lint
        run: ruff check .
      - name: Ruff extended hygiene (non-blocking)
        run: ruff check --select F,B --ignore E501,B008,B904,F401,F811,E402,E731,E741,E701,E702,B007,B905,F841 . || true
      - name: Pyright smoke
        run: pyright || true

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        # Windows sanity (agent sandbox covers win paths) — one interpreter only
        include:
          - os: windows-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]' --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Tests
        run: pytest tests/ -q --tb=short --ignore=tests/bench_generation.py --durations=15

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]' --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Coverage run
        run: |
          pytest tests/ -q --tb=line --ignore=tests/bench_generation.py \
            --cov=model_engine --cov=server --cov=agent \
            --cov=quantization --cov=chat_interface --cov=web_tools \
            --cov=eval --cov=evaluation --cov=export --cov=hf_integration \
            --cov-report=xml --cov-report=term || true
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  server-smoke:
    # Boot the OpenAI-compatible server against a tiny trained checkpoint and
    # curl the real HTTP surface — complements the TestClient tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test,serve]' --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Train tiny checkpoint
        run: |
          python - <<'PY'
          from model_engine import AuraLiteEngine
          text = "openai server smoke corpus for auralite pipeline. " * 60
          e = AuraLiteEngine()
          e.train(text, {"tokenizer": "char", "d_model": 32, "n_heads": 4,
                         "n_layers": 2, "d_ff": 64, "seq_length": 16,
                         "epochs": 1, "batch_size": 8, "val_split": 0.1,
                         "optimizer": "adamw", "lr_schedule": "cosine"})
          e.save_model("smoke.pt")
          print("checkpoint trained and saved")
          PY
      - name: Start server and probe endpoints
        run: |
          set -e
          AURALITE_MODEL=smoke.pt nohup python -m uvicorn server.openai_server:app \
            --host 127.0.0.1 --port 8123 > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8123/health && break || sleep 1
          done
          echo
          curl -sf -X POST http://127.0.0.1:8123/v1/completions \
            -H 'Content-Type: application/json' \
            -d '{"prompt":"openai","max_tokens":4}' | python -m json.tool
          curl -sf -X POST http://127.0.0.1:8123/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"hello"}],"max_tokens":4}' \
            | python -m json.tool
          echo "SERVER SMOKE OK"

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]' --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Benchmark smoke
        run: python benchmarks/benchmark_generation.py --quick || true

  docker:
    runs-on: ubuntu-latest
    needs: [lint, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Docker build CPU runtime
        run: docker build --target runtime-cpu -t auralite-ai:cpu .
