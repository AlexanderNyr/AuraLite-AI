name: AuraLite CI

on:
  push:
  pull_request:
  workflow_dispatch:  # manual runs (e.g. the PyInstaller smoke job)
    inputs:
      pyinstaller:
        description: "Also run the Windows PyInstaller smoke build"
        type: boolean
        default: false

# Least privilege: CI only reads the repo (cache uploads use the runtime token).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install linters
        # pyright is pinned: the ratchet below compares error counts, which
        # change between pyright releases (.github/pyright-baseline.json).
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[lint]' 'pyright==1.1.414' \
            --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Ruff critical lint
        run: ruff check .
      - name: Ruff extended hygiene (blocking)
        # v2.6.5: this promotion is safe only because the codebase is free of
        # F/E9/B findings today (bugs like zip-without-strict, unused loop
        # variables and raise-without-from were fixed in the 2.6.5 audit pass).
        # The ignores below are deliberate:
        #   F401 — optional-dependency probes / availability checks
        #   B008 — idiomatic FastAPI `Depends(...)` defaults
        #   B017 — tests assert broad exceptions on purpose (pydantic/dataclass)
        run: ruff check --select E9,F,B --ignore E501,F401,B008,B017 .
      - name: Text I/O names its encoding (blocking)
        # Windows opens files as cp1252 unless told otherwise: a bare
        # `Path.read_text()` broke the windows-latest leg on the CJK punctuation
        # in web_tools.py. PLW1514 (unspecified-encoding) is still a preview rule,
        # hence `--preview` — scoped to this one rule.
        run: ruff check --preview --select PLW1514 .
      - name: Ruff format check (advisory)
        run: ruff format --check . || true
      - name: Pyright ratchet (blocking)
        # 2.7.0: was `pyright || true` — hundreds of advisory errors, so a new one
        # was invisible. Now the count may only go down (scripts/pyright_ratchet.py).
        run: |
          pyright --outputjson > pyright.json || true
          python scripts/pyright_ratchet.py pyright.json

  tests:
    runs-on: ${{ matrix.os }}
    # A leg takes 3-6 minutes; a hang fails after 30 instead of GitHub's 6 hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Keep in sync with the classifiers in pyproject.toml (checked by
        # tests/test_release.py). 3.10 (end-of-life 2026-10-01) left in 2.7.0;
        # 3.15 joins once torch publishes cp315 wheels.
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # Windows sanity (agent sandbox covers win paths) — one interpreter only
          - os: windows-latest
            python: "3.11"
          # `ubuntu-latest` moves to 26.04 between 2026-10-19 and 2026-11-19
          # (actions/runner-images#14748); this leg shows any breakage first.
          - os: ubuntu-26.04
            python: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]' --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Ensure tkinter is importable
        # Without _tkinter ~90 GUI tests skip silently and the leg stays green.
        if: runner.os == 'Linux'
        run: |
          python -c "import tkinter" && exit 0
          echo "tkinter missing — installing the Tcl/Tk runtime"
          sudo apt-get update -qq
          # setup-python's builds link against Tk 8.6; `python3-tk` is the
          # fallback for images that only ship another Tk (Ubuntu 26.04+).
          sudo apt-get install -y -qq libtk8.6 libtcl8.6 || sudo apt-get install -y -qq python3-tk
          python -c "import tkinter; print('tkinter', tkinter.TkVersion)"
      - name: Tests
        run: pytest tests/ -q --tb=short --ignore=tests/bench_generation.py --durations=15

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]' --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Ensure tkinter is importable
        # The GUI suite drives real tkinter objects (mocked widgets, real
        # messagebox/filedialog modules), so a CPython build without _tkinter
        # would silently skip ~90 tests and tank the gui/ numbers below.
        run: |
          python -c "import tkinter" && exit 0
          echo "tkinter missing — installing the Tcl/Tk runtime"
          sudo apt-get update -qq
          # setup-python's builds link against Tk 8.6; `python3-tk` is the
          # fallback for images that only ship another Tk (Ubuntu 26.04+).
          sudo apt-get install -y -qq libtk8.6 libtcl8.6 || sudo apt-get install -y -qq python3-tk
          python -c "import tkinter; print('tkinter', tkinter.TkVersion)"
      - name: Coverage run
        run: |
          # The threshold makes coverage regressions fail the job. 2.7.0:
          # everything is one package, so one --cov measures it all (GUI, image
          # engine, CLI and kernels included): 86 % locally, 85.2 % in the last
          # 2.6.6 run. The gate moved from 60 % to 80 %: the step above fails
          # when tkinter cannot be installed, so the GUI suites cannot skip
          # silently and drag the number down any more.
          pytest tests/ -q --tb=line --ignore=tests/bench_generation.py \
            --cov=auralite \
            --cov-fail-under=80 \
            --cov-report=xml --cov-report=term
      - name: Report GUI coverage
        if: always()
        # Advisory: the GUI modules still have the lowest numbers in the repo.
        # Reads the JSON report: coverage.xml stores paths relative to each
        # --cov package, so the previous "gui/" filter never matched anything.
        run: |
          python -m coverage json -q -o coverage.json || exit 0
          python scripts/coverage_report.py coverage.json --prefix auralite/gui/ --limit 12 || true
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  optional-deps:
    # v2.6.5: exercises the code paths that are invisible without optional
    # packages — ONNX export, safetensors I/O, HF/peft and llama.cpp shims.
    # The original export bug (real ModernTransformer crashing TorchScript
    # export) lived exactly here: CI never installed onnx, so CI never saw it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install with optional dependencies
        run: |
          python -m pip install --upgrade pip
          # (the CPU index serves torchao's pure-Python "+cpu" build — the PyPI
          # wheel's CUDA extensions cannot load on CPU-only torch)
          pip install -e '.[test,serve,safetensors,export,torchao]' --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Optional-dependency test suites
        # 2.10.0: the image engine's .safetensors paths (engine + GUI dialogs) ran in
        # no job — the `.[test]` legs have no safetensors, and a GUI test that assumed
        # it failed in all of them. They run here, and a missing package is a failure
        # (`require()` in tests/_integration.py), not a silent skip.
        env:
          AURALITE_REQUIRE_INTEGRATIONS: "1"
        run: |
          python -c "import safetensors, tkinter; print('safetensors', safetensors.__version__, '| tk', tkinter.TkVersion)"
          pytest tests/test_export.py tests/test_bugfixes_regression.py \
                 tests/test_improvements_v265.py tests/test_hf_integration.py \
                 tests/test_learning_sanity.py tests/test_image_v210.py \
                 "tests/test_gui_tab_flows.py::TestImageTab" \
                 -q --tb=short -rs
      - name: torchao backend for real (not skipped)
        # 2.7.0: torchao is the successor of the deprecated torch.ao.quantization;
        # until 2.6 its path was never executed and had silently broken.
        env:
          AURALITE_REQUIRE_INTEGRATIONS: "1"
        run: |
          python -c "import torchao; print('torchao', torchao.__version__)"
          pytest tests/test_quantization_torchao.py -q -rs
          AURALITE_QUANT_BACKEND=torchao pytest tests/test_quantization.py -q -rs -k "dynamic"
      - name: Verify the real exports ran (not skipped)
        # 2.7.0: .pt2 (torch.export) and the torch.export-based ONNX exporter
        # (onnxscript comes with the `export` extra); the TorchScript paths stay
        # covered while PyTorch ships them. A missing onnx/onnxscript fails here.
        env:
          AURALITE_REQUIRE_INTEGRATIONS: "1"
        run: |
          pytest tests/test_bugfixes_regression.py tests/test_export.py -q -rs \
            -k "pt2 or torchscript_export_roundtrip or onnx_export_roundtrip or onnx_numeric_parity or torch_export_based or ExportCommand"

  integrations:
    # v2.6.6: transformers/peft and llama.cpp for real. Everything else talks to
    # fakes — which is how an unused `import bitsandbytes` could switch off the
    # whole HF integration without a single red test. The env var turns a
    # missing dependency or model into a failure: this job cannot pass by
    # skipping everything.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # latest = whatever pip resolves today (transformers 5.x);
        # minimum = the lower bounds of the `hf` extra in pyproject.toml.
        hf: [latest, minimum]
    env:
      AURALITE_REQUIRE_INTEGRATIONS: "1"
      AURALITE_TEST_GGUF: ${{ github.workspace }}/.gguf/stories260K.gguf
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (transformers + peft, prebuilt llama.cpp, no bitsandbytes)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test,serve,hf,gguf]' --only-binary llama-cpp-python \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          if [ "${{ matrix.hf }}" = "minimum" ]; then
            pip install "transformers==4.46.3" "peft==0.13.2" "accelerate==1.1.1"
          fi
          python -c "import transformers, peft; print('transformers', transformers.__version__, 'peft', peft.__version__)"
          python -c "import importlib.util as u; assert u.find_spec('bitsandbytes') is None, 'run without bitsandbytes'"
      - name: Cache the test model
        uses: actions/cache@v6
        with:
          path: .gguf
          key: gguf-stories260K-v1
      - name: Download stories260K.gguf (1.2 MB, ggml-org/models)
        run: |
          mkdir -p .gguf
          test -s "$AURALITE_TEST_GGUF" || curl -fsSL --retry 3 -o "$AURALITE_TEST_GGUF" \
            https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf
          ls -l "$AURALITE_TEST_GGUF"
      - name: Real Hugging Face and llama.cpp suites
        run: |
          pytest tests/test_hf_real.py tests/test_gguf_real.py tests/test_hf_integration.py \
            -q -rs --tb=short

  package:
    # The artifact users actually install. Every other job uses an editable
    # install, which sees the whole checkout — so a module missing from
    # pyproject's `py-modules` is invisible there. That is how wheels built from
    # the v2.6.5 tree got an `auralite` command that died with ModuleNotFoundError.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Install the wheel into a clean venv and smoke-test it
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/wheel-venv/bin/python -m pip install "$(ls dist/*.whl)[serve]" \
            --extra-index-url https://download.pytorch.org/whl/cpu
          cd /tmp && /tmp/wheel-venv/bin/python "$GITHUB_WORKSPACE/scripts/smoke_installed_wheel.py"

  server-smoke:
    # Boot the OpenAI-compatible server against a tiny trained checkpoint and
    # curl the real HTTP surface — complements the TestClient tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test,serve]' --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Train tiny checkpoint
        run: |
          python - <<'PY'
          from auralite import AuraLiteEngine
          text = "openai server smoke corpus for auralite pipeline. " * 60
          e = AuraLiteEngine()
          e.train(text, {"tokenizer": "char", "d_model": 32, "n_heads": 4,
                         "n_layers": 2, "d_ff": 64, "seq_length": 16,
                         "epochs": 1, "batch_size": 8, "val_split": 0.1,
                         "optimizer": "adamw", "lr_schedule": "cosine"})
          e.save_model("smoke.pt")
          print("checkpoint trained and saved")
          PY
      - name: Start server and probe endpoints
        run: |
          set -e
          AURALITE_MODEL=smoke.pt nohup python -m uvicorn auralite.server.openai_server:app \
            --host 127.0.0.1 --port 8123 > server.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8123/health; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8123/health > /dev/null || {
            echo "server never became healthy"; cat server.log; exit 1; }
          echo
          curl -sf -X POST http://127.0.0.1:8123/v1/completions \
            -H 'Content-Type: application/json' \
            -d '{"prompt":"openai","max_tokens":4}' | python -m json.tool
          curl -sf -X POST http://127.0.0.1:8123/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"hello"}],"max_tokens":4}' \
            | python -m json.tool
          echo "SERVER SMOKE OK"

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]' --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Benchmark smoke
        # v2.6.5: the script bootstraps sys.path itself, so `|| true` is gone —
        # a broken benchmark now fails the job instead of silently passing.
        run: |
          python benchmarks/benchmark_generation.py --quick
          python - <<'PY'
          import json
          data = json.load(open("benchmarks/latest_generation.json"))
          assert data["decode_tokens_per_sec"] > 0, data
          print("benchmark:", data)
          PY

  docker:
    runs-on: ubuntu-latest
    # Only lint: waiting for every test leg (Windows is the slowest, ~9 min) made
    # the image build the last two minutes of every CI run.
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Docker build CPU runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime-cpu
          tags: auralite-ai:cpu
          load: true            # keep the image for the smoke test below
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the image (non-root, trains, serves)
        # Until 2.6.5 the image was built but never started.
        run: |
          set -euo pipefail
          image=auralite-ai:cpu
          uid="$(docker run --rm "$image" id -u)"
          echo "container uid: $uid"
          test "$uid" != "0"
          docker volume create auralite-data
          docker run --rm -v auralite-data:/data "$image" python -c "
          from auralite import AuraLiteEngine
          e = AuraLiteEngine()
          e.train('docker smoke corpus for auralite. ' * 40, {'tokenizer': 'char',
                  'd_model': 32, 'n_heads': 4, 'n_layers': 2, 'd_ff': 64,
                  'seq_length': 16, 'epochs': 1, 'batch_size': 8, 'val_split': 0.1})
          e.save_model('/data/tiny.pt')
          print('trained /data/tiny.pt')"
          docker run -d --name auralite -p 8000:8000 -v auralite-data:/data \
            -e AURALITE_MODEL=/data/tiny.pt "$image"
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health > health.json && break
            sleep 1
          done
          cat health.json
          python3 -c "import json; h = json.load(open('health.json')); assert h['ok'] and h['model_loaded'], h"
          curl -sf -X POST http://127.0.0.1:8000/v1/completions \
            -H 'Content-Type: application/json' \
            -d '{"prompt":"docker","max_tokens":4}' | python3 -m json.tool
      - name: Container logs
        if: failure()
        run: docker logs auralite || true

  pyinstaller-smoke:
    # Manual/nightly check that the Windows exe build still works. Kept off the
    # default push path (cold PyInstaller builds are slow) — run it before a
    # release with:  gh workflow run ci.yml -f pyinstaller=true
    # (the input must be declared above — GitHub rejects undeclared inputs).
    if: github.event_name == 'workflow_dispatch' && inputs.pyinstaller
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - name: Build exe (build_exe.bat)
        run: cmd /c build_exe.bat
      - name: Verify artifact exists
        run: dir dist
