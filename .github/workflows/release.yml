name: Release

# Tag → verify → build → GitHub Release → GHCR image.
#
# Roadmap P2.14: a release must not depend on somebody's laptop. Push a tag like
# `v2.6.5` (annotated or not) and this workflow republishes the exact artifacts
# that CI tested on that commit:
#   * `verify`  — version strings agree with the tag, ruff gate, fast test suite;
#   * `build`   — sdist + wheel, `twine check`, then the wheel is installed into a
#                 clean venv and `scripts/smoke_installed_wheel.py` checks that
#                 every module imports from site-packages and `auralite` runs;
#   * `release` — GitHub Release with the artifacts attached and auto notes,
#                 plus signed SLSA build-provenance attestations for them
#                 (`gh attestation verify <file> -R <owner>/<repo>`);
#   * `image`   — ghcr.io/<owner>/auralite-ai:<version> and :latest (CPU runtime);
#   * `pypi`    — PyPI via Trusted Publishing (OIDC, no API token stored
#                 anywhere). Off by default; see docs/releasing.md to enable it:
#                 register the publisher on pypi.org, create the `pypi`
#                 environment, set the repository variable PYPI_PUBLISH=true.
#
# Dry run (v2.6.6): Actions → Release → "Run workflow" with `dry_run` ticked (the
# default for manual runs) executes verify + build + the image build on the
# selected branch, and publishes nothing — no GitHub Release, no image push, no
# PyPI upload. That is how this workflow gets exercised before the first tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (leave empty for a dry run of the selected branch)"
        required: false
        default: ""
      dry_run:
        description: "Dry run: verify and build only, publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # release notes walk the history
          # A manual run with `tag` must test the tagged commit, not the branch
          # the button was pressed on (until 2.6.5 it checked out the branch).
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test,serve]' --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Resolve the version being released
        id: version
        env:
          TAG_INPUT: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ -n "$TAG_INPUT" ]; then
            ref="$TAG_INPUT"
          elif [ "$REF_TYPE" = "tag" ]; then
            ref="$REF_NAME"
          elif [ "$DRY_RUN" = "true" ]; then
            # No tag on a dry run: release-check whatever pyproject.toml says.
            ref="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          else
            echo "::error::not a tag push and no 'tag' input: nothing to release"
            exit 1
          fi
          version="${ref#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing $version (from $ref, dry run: ${DRY_RUN:-false})"
      - name: Version strings must agree with the tag
        run: python scripts/check_version_consistency.py "${{ steps.version.outputs.version }}"
      - name: Ruff gate (same selectors as CI)
        run: |
          pip install 'ruff>=0.5'
          ruff check .
          ruff check --select E9,F,B --ignore E501,F401,B008,B017 .
      - name: Fast test suite
        run: pytest tests/ -q --tb=short -x --ignore=tests/bench_generation.py

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Inspect the artifacts
        run: |
          ls -lh dist/
          python -m pip install --upgrade twine
          twine check dist/*
      - name: The installed wheel must be complete
        # `[serve]` is the documented install; the server module needs FastAPI.
        # (The previous inline check imported the server from a wheel installed
        # *without* that extra, so this step could never have passed.)
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/wheel-venv/bin/python -m pip install "$(ls dist/*.whl)[serve]" \
            --extra-index-url https://download.pytorch.org/whl/cpu
          cd /tmp && /tmp/wheel-venv/bin/python "$GITHUB_WORKSPACE/scripts/smoke_installed_wheel.py"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          retention-days: 14

  release:
    needs: [verify, build]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write         # create the Release and its tag
      id-token: write         # Sigstore certificate for the attestations
      attestations: write     # store them with the repository
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download the built artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Attest build provenance (2.7.0)
        # Signed SLSA provenance for the exact files attached below. (The PyPI
        # upload gets its own PEP 740 attestations from pypa/gh-action-pypi-publish.)
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.verify.outputs.version }}
          name: v${{ needs.verify.outputs.version }}
          generate_release_notes: true
          files: dist/*
          body: |
            Built and tested by CI on this commit.

            Artifacts: `auralite_ai-${{ needs.verify.outputs.version }}-py3-none-any.whl`
            and the source distribution, with signed build provenance
            (`gh attestation verify <file> -R ${{ github.repository }}`). Install:

            ```bash
            ${{ vars.PYPI_PUBLISH == 'true' && format('pip install "auralite-ai[serve]=={0}"', needs.verify.outputs.version) || format('pip install "auralite-ai[serve] @ https://github.com/{0}/releases/download/v{1}/auralite_ai-{1}-py3-none-any.whl"', github.repository, needs.verify.outputs.version) }}
            ```

            Docker: `docker pull ghcr.io/${{ github.repository }}:${{ needs.verify.outputs.version }}`

            What changed: see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/v${{ needs.verify.outputs.version }}/CHANGELOG.md)
            and the docs in [`docs/`](https://github.com/${{ github.repository }}/tree/v${{ needs.verify.outputs.version }}/docs).

  image:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write         # push to GHCR
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=raw,value=latest
      - name: Build and push the CPU runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime-cpu
          push: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pypi:
    # Trusted Publishing: PyPI trusts this workflow's OIDC identity, so no
    # long-lived token exists to leak. Gated twice: the repository variable
    # (nothing happens until the maintainer opts in) and the `pypi` environment
    # (where required reviewers can be added). Publishes exactly the artifacts
    # that `build` produced and smoke-tested.
    needs: [verify, build]
    if: vars.PYPI_PUBLISH == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/auralite-ai
    permissions:
      id-token: write         # mandatory for Trusted Publishing
    steps:
      - name: Download the built artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
